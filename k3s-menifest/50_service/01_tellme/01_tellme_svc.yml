apiVersion: apps/v1
kind: Deployment
metadata:
  name: tellme-next-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tellme-next-app
  template:
    metadata:
      labels:
        app: tellme-next-app
    spec:
      containers:
      - name: web
        image: registry.labz.org/tellme-next:v1
        ports:
        - containerPort: 3900
        imagePullPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: tellme-next-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: tellme-next-app
  ports:
    - protocol: TCP
      port: 3900                
      targetPort: 3900          
      nodePort: 30090        