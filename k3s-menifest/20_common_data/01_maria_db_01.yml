---
apiVersion: v1
kind: Namespace
metadata:
  name: nginx-proxy-manager
---
# 1. MariaDB용 서비스
apiVersion: v1
kind: Service
metadata:
  name: npm-db
  namespace: nginx-proxy-manager
spec:
  ports:
    - port: 3306
  selector:
    app: npm-db
  clusterIP: None # 내부 통신용이라 외부 IP 불필요

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: npm-db
  namespace: nginx-proxy-manager
spec:
  selector:
    matchLabels:
      app: npm-db
  template:
    metadata:
      labels:
        app: npm-db
    spec:
      containers:
        - name: mariadb
          image: jc21/mariadb-aria:latest # 경량화 maria db image
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "npm"    # temporary
            - name: MYSQL_DATABASE
              value: "npm"
            - name: MYSQL_USER
              value: "npm"
            - name: MYSQL_PASSWORD
              value: "npm"     # temporary
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: npm-db-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: npm-db-pvc
  namespace: nginx-proxy-manager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # storageClassName: "" # NFS Provisioner가 기본값이면 생략 가능